services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: secret
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - path: backend/.env
        required: true
    expose:
      - "${API_PORT:-9000}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./backend
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${NGINX_PORT:-8000}:80"
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    env_file:
      - path: frontend/.env
        required: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  postgres_data:
